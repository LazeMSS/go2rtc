<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC Sync Player - go2rtc</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body class="stream-body-page">

<!-- Top Navigation Bar -->
<header class="stream-nav-bar" id="stream-nav">
    <div class="stream-nav-left">
        <a href="index.html" id="btn-back" class="btn btn-secondary btn-sm" title="Back to Streams">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Back
        </a>
        <div class="stream-page-title">
            <span class="status-dot"></span>
            <span id="nav-title">WebRTC Stream</span>
            <span class="badge badge-idle" id="nav-mode">WebRTC (Sync)</span>
        </div>
    </div>

    <div class="stream-nav-right">
        <button type="button" id="btn-reconnect" class="btn btn-secondary btn-sm" title="Reconnect Stream">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            Reconnect
        </button>
        <button type="button" id="btn-fullscreen" class="btn btn-secondary btn-sm" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            Fullscreen
        </button>
    </div>
</header>

<!-- Video Container Frame -->
<main id="stream-container" class="stream-grid-container single-stream">
    <camera-frame id="stream-frame" title="WebRTC Sync Player" links has-unmute>
        <video id="video" autoplay playsinline muted></video>
</main>

<script src="js/camera-frame.js"></script>
<script src="js/main.js"></script>
<script src="js/webrtc-sync.js"></script>
</body>
</html>
