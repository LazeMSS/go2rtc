<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>net - go2rtc</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="js/vendors/vis-network.min.js"></script>
</head>
<body>

<script src="js/main.js"></script>

<main class="config-page-layout">
    <div class="toolbar-card config-toolbar">
        <div class="toolbar-left">
            <div class="config-header-title">
                <svg class="config-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <span>Network Topology</span>
            </div>
            <span class="badge badge-idle" id="network-status">Idle</span>
            <span class="badge badge-idle hidden" id="network-nodes">0 Nodes</span>
        </div>

        <div class="toolbar-right">
            <button id="btn-fit" class="btn btn-secondary btn-sm" title="Center and fit network graph">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <span>Fit Graph</span>
            </button>
            <button id="btn-refresh" class="btn btn-primary btn-sm" title="Refresh network topology">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                <span>Refresh</span>
            </button>
        </div>
    </div>

    <div class="network-wrapper" id="network-wrapper">
        <div id="network"></div>

        <div id="empty-state" class="network-empty-overlay hidden">
            <div class="network-empty-card">
                <div class="empty-icon empty-icon-lg">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                </div>
                <div class="empty-text">No Active Consumers</div>
                <div class="empty-subtext empty-subtext-relaxed">
                    The network topology graph only visualizes active connections. Currently there are no clients or consumers streaming video or audio.
                </div>
                <div class="empty-action-wrap">
                    <a href="index.html" class="btn btn-primary btn-sm">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <span>Go to Streams</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="js/net.js"></script>
</body>
</html>
