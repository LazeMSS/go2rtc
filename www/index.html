<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go2rtc - Streams</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script src="js/main.js"></script>

<main class="modern-main">
    <!-- Metrics Overview -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </div>
            <div class="metric-data">
                <span class="metric-value" id="metric-total">0</span>
                <span class="metric-label">Registered Streams</span>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-icon active-icon">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
            <div class="metric-data">
                <span class="metric-value" id="metric-active">0</span>
                <span class="metric-label">Active Consumers</span>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-icon purple-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <div class="metric-data">
                <span class="metric-value" id="metric-selected">0</span>
                <span class="metric-label">Selected Streams</span>
            </div>
        </div>
    </div>

    <!-- Action Toolbar -->
    <div class="toolbar-card controls">
        <div class="toolbar-left">
            <button id="btn-stream" class="btn btn-primary" title="Stream selected cameras">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                Stream Selected
            </button>

            <div class="modes-container">
                <span class="modes-label" title="Streaming protocols to request when streaming">Stream With:</span>
                <div class="modes-group">
                    <label class="mode-chip active" id="chip-webrtc" title="WebRTC (Ultra-low latency)">
                        <input type="checkbox" name="webrtc" checked> WebRTC
                    </label>
                    <label class="mode-chip active" id="chip-mse" title="MSE (Media Source Extensions)">
                        <input type="checkbox" name="mse" checked> MSE
                    </label>
                    <label class="mode-chip active" id="chip-hls" title="HLS (HTTP Live Streaming)">
                        <input type="checkbox" name="hls" checked> HLS
                    </label>
                    <label class="mode-chip active" id="chip-mjpeg" title="MJPEG (Motion JPEG)">
                        <input type="checkbox" name="mjpeg" checked> MJPEG
                    </label>
                </div>
            </div>
        </div>

        <div class="toolbar-right">
            <div class="status-filters" id="status-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="live">Live (<span id="filter-live-count">0</span>)</button>
                <button class="filter-btn" data-filter="idle">Idle</button>
            </div>

            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="search" id="stream-filter" class="search-input" placeholder="Filter streams by name...">
            </div>
        </div>
    </div>

    <!-- Streams Table -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="modern-table" id="streams-table">
                <thead>
                    <tr>
                        <th class="col-check">
                            <input id="selectall" type="checkbox" title="Select All Streams">
                        </th>
                        <th class="col-name sortable" id="th-stream-name" title="Click to sort (Config Order / A-Z / Z-A)">
                            <div class="th-sort-wrapper">
                                <span>Stream Name</span>
                                <span class="sort-indicator" id="sort-indicator" aria-hidden="true">
                                    <svg viewBox="0 0 24 24"><path d="M12 5.83L15.17 9l1.41-1.41L12 3 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 21l4.59-4.59L15.17 15 12 18.17z"/></svg>
                                </span>
                                <span class="sort-badge hidden" id="sort-badge"></span>
                            </div>
                        </th>
                        <th class="col-status">Status & Diagnostics</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="streams">
                </tbody>
            </table>
        </div>
        <div id="empty-state" class="empty-state hidden">
            <svg id="empty-icon" class="empty-icon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div id="empty-title" class="empty-text">No cameras configured</div>
            <div id="empty-subtext" class="empty-subtext">Add your first camera stream to get started.</div>
            <div>
                <a href="add.html" id="empty-btn-add" class="btn btn-primary btn-lg mt-sm">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Add Camera
                </a>
            </div>
        </div>
        <div class="table-card-footer hidden" id="table-footer">
            <a href="add.html" class="btn btn-secondary btn-sm" id="btn-bottom-add" title="Add a new stream">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Add Camera
            </a>
        </div>
    </div>
</main>

<footer class="modern-footer">
    <div class="footer-content">
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>API Online</span>
        </div>
        <div class="info" id="footer-info">Loading system info...</div>
    </div>
</footer>

<script src="js/index.js"></script>
</body>
</html>
